apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: familienplaner
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: frontend
          image: registry.example.com/your-user/familienplaner-frontend:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: familienplaner
spec:
  type: ClusterIP
  selector: { app: frontend }
  ports:
    - port: 80
      targetPort: 80
