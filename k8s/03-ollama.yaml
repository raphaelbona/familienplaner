apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-data
  namespace: familienplaner
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: familienplaner
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: ollama }
  template:
    metadata:
      labels: { app: ollama }
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - containerPort: 11434
          resources:
            requests:
              memory: "1Gi"
              cpu: "250m"
            limits:
              memory: "4Gi"
          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama
      volumes:
        - name: ollama-data
          persistentVolumeClaim: { claimName: ollama-data }
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: familienplaner
spec:
  selector: { app: ollama }
  ports:
    - port: 11434
      targetPort: 11434
