apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uploads-data
  namespace: familienplaner
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: backend-migrate
  namespace: familienplaner
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: regcred
      containers:
        - name: migrate
          image: registry.example.com/your-user/familienplaner-backend:latest
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - secretRef: { name: backend-env }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: familienplaner
spec:
  replicas: 1
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: backend
          image: registry.example.com/your-user/familienplaner-backend:latest
          envFrom:
            - secretRef: { name: backend-env }
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: uploads-data
              mountPath: /app/uploads
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 15
      volumes:
        - name: uploads-data
          persistentVolumeClaim: { claimName: uploads-data }
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: familienplaner
spec:
  type: ClusterIP
  selector: { app: backend }
  ports:
    - port: 8000
      targetPort: 8000
