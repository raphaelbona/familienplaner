server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # PWA: alle unbekannten Pfade auf index.html zurückführen (client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Vite hasht Dateinamen bei jeder Änderung (z.B. index-ClfoV_19.js) -- diese
    # Dateien dürfen daher unbegrenzt/aggressiv gecacht werden, ohne dass Nutzer
    # je eine veraltete Version bekommen (ein neuer Build hat einen neuen Namen).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
